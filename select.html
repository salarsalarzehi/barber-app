<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیرایش سالار | انتخاب روش رزرو</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 { color: #f1c40f; margin-bottom: 5px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 0;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn-bale {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }
        .btn-web {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="card">
        <h2>💈 پیرایش سالار</h2>
        <p>لطفاً روش رزرو نوبت خود را انتخاب کنید:</p>

        <!-- دکمه هدایت مستقیم به اپلیکیشن بله -->
        <a href="bale://arminbarberbot" onclick="openBaleFallback(event)" class="btn btn-bale">
            💬 رزرو در پیام‌رسان بله
        </a>

        <!-- دکمه ورود به فرم رزرو مرورگر -->
        <a href="https://salarsalarzehi.github.io/barber-app/" class="btn btn-web">
            🌐 رزرو مستقیم در مرورگر (بدون بله)
        </a>
    </div>

    <script>
        function openBaleFallback(e) {
            // سعی در باز کردن مستقیم اپلیکیشن بله
            window.location.href = "bale://arminbarberbot";
            
            // اگر بله روی گوشی نصب نبود یا باز نشد، پس از نیم ثانیه لینک وب بله باز می‌شود
            setTimeout(function() {
                window.location.href = "https://ble.ir/arminbarberbot";
            }, 500);
        }
    </script>

</body>
</html>
