<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیرایش سالار | روش رزرو را انتخاب کنید</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 { color: #f1c40f; margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { color: #bbb; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 10px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-bale {
            background-color: #27ae60;
            color: #ffffff !important;
        }
        .btn-web {
            background-color: #2980b9;
            color: #ffffff !important;
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="card">
        <h2>💈 پیرایش سالار</h2>
        <p>لطفاً روش رزرو نوبت خود را انتخاب کنید:</p>

        <!-- لینک مستقیم و هوشمند بله -->
        <a href="https://ble.ir/arminbarberbot" class="btn btn-bale">
            💬 رزرو مستقیم در اپلیکیشن بله
        </a>

        <!-- لینک مستقیم به فایل فرم اصلی رزرو -->
        <a href="https://salarsalarzehi.github.io/barber-app/index.html" class="btn btn-web">
            🌐 رزرو سریع در مرورگر (بدون نصب اپ)
        </a>
    </div>

</body>
</html>
