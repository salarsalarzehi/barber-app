<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیرایش سالار | روش رزرو را انتخاب کنید</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 { color: #f1c40f; margin-bottom: 5px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 0;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .btn-bale {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        .btn-bale:hover { background: #27ae60; }
        .btn-web {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        .btn-web:hover { background: #2980b9; }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="card">
        <h2>💈 پیرایش سالار</h2>
        <p>لطفاً روش رزرو نوبت خود را انتخاب کنید:</p>

        <!-- دکمه هوشمند بله -->
        <button class="btn btn-bale" onclick="openBale()">
            💬 رزرو مستقیم در اپلیکیشن بله
        </button>

        <!-- دکمه مرورگر (بدون بله) -->
        <button class="btn btn-web" onclick="openWeb()">
            🌐 رزرو سریع در مرورگر (بدون نصب اپ)
        </button>
    </div>

    <script>
        function openBale() {
            // لینک عمومی ربات بله
            const baleUrl = "https://ble.ir/arminbarberbot";
            
            // لینک مستقیم هوشمند برای اندروید (مستقیماً بله را باز می‌کند)
            const intentLink = "intent://ble.ir/arminbarberbot#Intent;scheme=https;package=ir.bale.messenger;S.browser_fallback_url=https%3A%2F%2Fble.ir%2Farminbarberbot%3Fstart%3Dqrcode;end";

            // تشخیص سیستم عامل مشتری
            if (navigator.userAgent.match(/Android/i)) {
                // اگر اندروید است، لینک هوشمند را باز کن
                window.location.href = intentLink;
            } else {
                // اگر آیفون یا کامپیوتر است، لینک عمومی را باز کن
                window.location.href = baleUrl;
            }
        }

        function openWeb() {
            // لینک مینی‌اپ اصلی شما (index.html)
            const webAppUrl = "https://salarsalarzehi.github.io/barber-app/";
            
            // باز کردن مستقیماً در مرورگر بدون پرسش
            window.open(webAppUrl, "_blank");
        }
    </script>

</body>
</html>
