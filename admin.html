<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت ساعت‌ها</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 15px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #333;
    }
    h3 { color: #f1c40f; text-align: center; margin-top: 0; }
    p { color: #aaa; font-size: 12px; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
    .time-btn {
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .active { background: #27ae60; color: white; }
    .disabled { background: #c0392b; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h3>⚙️ مدیریت وضعیت ساعت‌ها</h3>
    <p>روی هر ساعت بزنید تا وضعیت آن تغییر کند:</p>
    <div class="grid" id="adminGrid">در حال دریافت وضعیت...</div>
  </div>

  <script>
    const API_URL = "https://api.npoint.io/97d3a2e9e382c87c3c41";

    const allTimes = [
      "۱۰:۰۰ - ۱۱:۰۰",
      "۱۱:۰۰ - ۱۲:۰۰",
      "۱۶:۰۰ - ۱۷:۰۰",
      "۱۷:۰۰ - ۱۸:۰۰",
      "۱۸:۰۰ - ۱۹:۰۰",
      "۱۹:۰۰ - ۲۰:۰۰"
    ];

    let disabledTimes = [];

    function loadData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          disabledTimes = data.disabled || [];
          render();
        });
    }

    function render() {
      const grid = document.getElementById("adminGrid");
      grid.innerHTML = "";

      allTimes.forEach(time => {
        const btn = document.createElement("button");
        const isDisabled = disabledTimes.includes(time);
        
        btn.className = "time-btn " + (isDisabled ? "disabled" : "active");
        btn.innerHTML = `<span>${time}</span> <span>${isDisabled ? "🔴 پر شده / غیرفعال" : "🟢 آزاد / فعال"}</span>`;
        
        btn.onclick = () => toggleTime(time);
        grid.appendChild(btn);
      });
    }

    function toggleTime(time) {
      if (disabledTimes.includes(time)) {
        disabledTimes = disabledTimes.filter(t => t !== time);
      } else {
        disabledTimes.push(time);
      }

      render();

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ disabled: disabledTimes })
      });
    }

    loadData();
  </script>
</body>
</html>
