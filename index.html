<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیرایش سالار | رزرو نوبت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #333;
    }
    h2 { color: #f1c40f; text-align: center; margin-top: 0; }
    .section-title { font-weight: bold; margin: 15px 0 10px; color: #ddd; }
    
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .time-btn {
      background: #2c3e50;
      color: #fff;
      border: 2px solid #34495e;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .time-btn.selected {
      background: #f1c40f;
      color: #000;
      border-color: #f39c12;
    }
    .time-btn.disabled {
      background: #333333 !important;
      color: #777777 !important;
      border-color: #444444 !important;
      cursor: not-allowed !important;
      opacity: 0.6;
    }

    .submit-btn {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>💈 پیرایش سالار</h2>
    <p style="text-align: center; color: #aaa; font-size: 13px;">لطفاً زمان حضور خود را انتخاب کنید:</p>

    <div class="section-title">⏰ انتخاب ساعت:</div>
    <div class="time-grid" id="timeGrid">در حال دریافت ساعت‌ها...</div>

    <button class="submit-btn" onclick="submitBooking()">ثبت و ارسال نوبت</button>
  </div>

  <script>
    const API_URL = "https://api.npoint.io/97d3a2e9e382c87c3c41";

    const allTimes = [
      "۱۰:۰۰ - ۱۱:۰۰",
      "۱۱:۰۰ - ۱۲:۰۰",
      "۱۶:۰۰ - ۱۷:۰۰",
      "۱۷:۰۰ - ۱۸:۰۰",
      "۱۸:۰۰ - ۱۹:۰۰",
      "۱۹:۰۰ - ۲۰:۰۰"
    ];

    let selectedTime = "";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const disabledTimes = data.disabled || [];
        const grid = document.getElementById("timeGrid");
        grid.innerHTML = "";

        allTimes.forEach(time => {
          const btn = document.createElement("button");
          btn.className = "time-btn";
          
          if (disabledTimes.includes(time)) {
            btn.classList.add("disabled");
            btn.innerText = time + " (تکمیل)";
            btn.disabled = true;
          } else {
            btn.innerText = time;
            btn.onclick = () => selectTime(btn, time);
          }
          grid.appendChild(btn);
        });
      });

    function selectTime(btn, time) {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTime = time;
    }

    function submitBooking() {
      if (!selectedTime) {
        alert("لطفاً یک ساعت را برای رزرو انتخاب کنید.");
        return;
      }

      const BOT_TOKEN = "972040610:bOwW_rjWMTTb0WEU7ZGbetGw__T2CyZGH-4";
      const MY_CHAT_ID = "307937390";

      const service = "اصلاح کامل سر و صورت";
      const trackingCode = Math.floor(1000 + Math.random() * 9000);

      let customerId = null;
      let customerName = "مشتری بله";

      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        customerId = window.Telegram.WebApp.initDataUnsafe.user.id;
        customerName = window.Telegram.WebApp.initDataUnsafe.user.first_name || "مشتری";
      }

      const adminMessage = `💈 **نوبت جدید در پیرایش سالار**\n\n` +
                           `👤 **مشتری:** ${customerName}\n` +
                           `✂️ **خدمت:** ${service}\n` +
                           `⏰ **زمان:** ${selectedTime}\n` +
                           `🔢 **کد پیگیری:** ${trackingCode}`;

      fetch(`https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: MY_CHAT_ID, text: adminMessage })
      });

      if (customerId) {
        const customerMessage = `💈 **پیرایش سالار**\n\n` +
                                `سلام ${customerName} عزیز، نوبت شما با موفقیت ثبت شد! ✅\n\n` +
                                `✂️ **خدمت:** ${service}\n` +
                                `⏰ **زمان حضور:** ${selectedTime}\n` +
                                `🔢 **کد پیگیری:** ${trackingCode}\n\n` +
                                `منتظر دیدار شما هستیم.`;

        fetch(`https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: customerId, text: customerMessage })
        });
      }

      alert("✅ نوبت شما برای ساعت " + selectedTime + " با موفقیت ثبت شد!");
    }
  </script>
</body>
</html>
