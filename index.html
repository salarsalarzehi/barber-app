
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیرایش سالار | رزرو آنلاین</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --gold: #d4af37;
      --text: #ffffff;
    }
    body {
      font-family: Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 15px;
      direction: rtl;
    }
    .header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .header h2 { color: var(--gold); margin: 5px 0; }
    .card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .slot { display: inline-block; background: #2a2a2a; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; margin: 4px; cursor: pointer; font-size: 13px; }
    .slot.active { background: var(--gold); color: #000; font-weight: bold; }
    .slot.disabled { background: #1a1a1a; color: #555; border-color: #222; text-decoration: line-through; pointer-events: none; }
  </style>
</head>
<body>

  <div class="header">
    <h2>💈 پیرایش سالار</h2>
    <p style="font-size: 12px; color: #aaa;">سامانه آنلاین رزرو نوبت</p>
  </div>

  <div class="card">
    <h4 style="color: var(--gold); margin-top:0;">۱. انتخاب خدمت</h4>
    <label><input type="checkbox" checked> اصلاح کامل سر و صورت (۱۵۰,۰۰۰ تومان)</label><br><br>
    <label><input type="checkbox"> پاکسازی و فشیال پوست (۲۵۰,۰۰۰ تومان)</label>
  </div>

  <div class="card">
    <h4 style="color: var(--gold); margin-top:0;">۲. انتخاب ساعت حضور</h4>
    <div class="slot active">۱۶:۰۰ - ۱۷:۰۰</div>
    <div class="slot">۱۷:۰۰ - ۱۸:۰۰</div>
    <div class="slot disabled">۱۸:۰۰ - ۱۹:۰۰ (پر شد)</div>
  </div>

  <button class="btn" onclick="submitBooking()">تأیید و ثبت نوبت</button>

<!-- اسکریپت رسمی بله برای دریافت اطلاعات کاربر -->
  <script src="https://backend.bale.ai/sdk/bale-sdk.js"></script>

  <script>
    // مقداردهی اولیه SDK بله (اگر داخل بله باز شده باشد)
    let baleUser = null;
    if (window.Bale && window.Bale.WebApp) {
      window.Bale.WebApp.ready();
      baleUser = window.Bale.WebApp.initDataUnsafe?.user;
    }

    function submitBooking() {
      const BOT_TOKEN = "972040610:bOwW_rjWMTTb0WEU7ZGbetGw__T2CyZGH-4";
      const MY_CHAT_ID = "307937390"; // چت‌آیدی شما (آرایشگر)

      const service = "اصلاح کامل سر و صورت";
      const time = "۱۶:۰۰ - ۱۷:۰۰";
      const trackingCode = Math.floor(1000 + Math.random() * 9000);

      // ۱. ارسال پیام به شما (مدیر سالن)
      const adminMessage = `💈 **نوبت جدید در پیرایش سالار**\n\n` +
                           `👤 **مشتری:** ${baleUser ? baleUser.first_name : "از طریق مرورگر"}\n` +
                           `✂️ **خدمت:** ${service}\n` +
                           `⏰ **زمان:** ${time}\n` +
                           `🔢 **کد پیگیری:** ${trackingCode}`;

      const adminUrl = `https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage?chat_id=${MY_CHAT_ID}&text=${encodeURIComponent(adminMessage)}`;
      new Image().src = adminUrl;

      // ۲. ارسال پیام تأییدیه به خودِ مشتری (اگر از داخل بله باز کرده باشد)
      if (baleUser && baleUser.id) {
        const customerMessage = `💈 **پیرایش سالار**\n\n` +
                                `سلام ${baleUser.first_name} عزیز، نوبت شما با موفقیت ثبت شد! ✅\n\n` +
                                `✂️ **خدمت:** ${service}\n` +
                                `⏰ **زمان حضور:** ${time}\n` +
                                `🔢 **کد پیگیری:** ${trackingCode}\n\n` +
                                `منتظر دیدار شما هستیم.`;

        const customerUrl = `https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage?chat_id=${baleUser.id}&text=${encodeURIComponent(customerMessage)}`;
        new Image().src = customerUrl;
      }

      alert("✅ نوبت شما با موفقیت ثبت شد!");
    }
  </script>
</body>
</html>
